name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    # 用例只依赖 127.0.0.1 的 UDP 回环，ubuntu 上可直接跑
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EFramework_Server.sln

      - name: Build (Release)
        # 零第三方依赖，restore 无需联网拉包；若将来引入 NuGet，这里会自动生效
        run: dotnet build EFramework_Server.sln -c Release --no-restore --nologo

      - name: Verify protocol + end-to-end cases
        run: dotnet run --project tests/EFramework.Tests -c Release --no-build
